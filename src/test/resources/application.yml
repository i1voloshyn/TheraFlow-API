spring:
  mail:
    host: 127.0.0.1
    port: 3025
    protocol: smtp
    password: root
    username: spring
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  mail-from: no-reply@theraflow.com

  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: 5 #5 minute
      refresh-token:
        expiration: 7 #7 days
      email:
        secret-key: ${JWT_EMAIL_SECRET}
        expiration: 60 #60 minutes

